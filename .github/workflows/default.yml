name: CI and publication

on:
  push:
    branches: [main, release/stable, release/rc, 'release/*.x', ci]
  pull_request:
    branches: [main, release/stable, release/rc, 'release/*.x', ci]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: medrunner-services/ci/.github/workflows/wf-test-node.yml@v1
    permissions:
      contents: read
      packages: read
    with:
      node-version: 24.x
      package-manager: pnpm
      private-packages: false
      test-if-present: true
      additional-check-script: contracts:check

  release:
    if: ${{ github.event_name == 'push' }}
    needs: test
    uses: medrunner-services/ci/.github/workflows/wf-release-semantic.yml@v1
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      environment-name: release
      standard-branches: true
      release-ref-name: release/stable
      default-branch: main
      enable-backpropagation: false
      backpropagation-approve: false
      backpropagation-auto-merge: false

  publish:
    if: ${{ github.event_name == 'push' && needs.release.outputs.release-published == 'true' }}
    needs: release
    uses: medrunner-services/ci/.github/workflows/wf-publish-node.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    with:
      environment-name: publish-npm
      registry-url: https://registry.npmjs.org
      package-manager: pnpm
      private-packages: false
      version: ${{ needs.release.outputs.new-version }}
      release-tag: ${{ needs.release.outputs.new-tag }}
      channel: ${{ needs.release.outputs.new-channel }}
