name: CI Build

on: [push]

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/checkout@v4

      - run: pnpm install
      - run: pnpm check
      - run: pnpm build
