name: CI Build

on: [push]

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Compile code
        run: npm run build

      - name: Run eslint
        run: npm run lint

      - name: Run prettier
        run: npm run prettier
